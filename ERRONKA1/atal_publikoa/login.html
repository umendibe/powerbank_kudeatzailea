<!DOCTYPE html>
<html lang="eu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saioa hasi | Powerbank alokazioa</title>
  <link rel="icon" type="image/svg+xml" href="assets/placeholder.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/estiloak.css" />
</head>
<body data-page="login">
  <div id="navbar"></div>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-xl-5">
        <div id="alerta"></div>

        <div class="card auth-card border-0 shadow-sm mx-auto">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <div class="profile-avatar mx-auto mb-3">
                <i class="bi bi-person-lock"></i>
              </div>
              <h1 class="h3 mb-1">Saioa hasi</h1>
              <p class="text-muted mb-0">Erreserbak egin eta zure kontua kudeatzeko.</p>
            </div>

            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Emaila</label>
                <input id="email" name="email" type="email" class="form-control" autocomplete="email" required />
                <div class="invalid-feedback">Sartu email baliozkoa.</div>
              </div>

              <div class="mb-4">
                <label for="pasahitza" class="form-label">Pasahitza</label>
                <input id="pasahitza" name="pasahitza" type="password" class="form-control" autocomplete="current-password" required />
                <div class="invalid-feedback">Sartu pasahitza.</div>
              </div>

              <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right me-1"></i>Saioa hasi
              </button>
            </form>

            <hr class="my-4" />

            <p class="text-center text-muted mb-0">
              Ez duzu konturik?
              <a href="erregistroa.html" class="fw-semibold" id="registerLink">Erregistratu</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 mt-auto">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
      <span>&copy; <span id="urtea"></span> Powerbank alokazioa</span>
      <span><a href="index.html">Kargaguneak</a> · <a href="erregistroa.html">Erregistratu</a></span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
