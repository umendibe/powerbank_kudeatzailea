@if (isLoggedIn()) {
  <header class="app-header">
    <nav class="navbar navbar-expand-lg app-navbar">
      <div class="container-fluid app-navbar-inner">
        <a class="navbar-brand app-brand" routerLink="/">
          <span class="app-brand-icon">
            <i class="bi bi-battery-charging"></i>
          </span>
          <span class="app-brand-copy">
            <span class="app-brand-title">Administrazioa</span>
            <span class="app-brand-subtitle">Powerbank alokazioa</span>
          </span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false"
          aria-label="Menua ireki">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav app-nav-links me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" routerLink="/erabiltzaileak" routerLinkActive="active">
                <i class="bi bi-people me-1"></i>Erabiltzaileak
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/kargaguneak" routerLinkActive="active">
                <i class="bi bi-geo-alt me-1"></i>Kargaguneak
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/powerbanks" routerLinkActive="active">
                <i class="bi bi-battery-full me-1"></i>Powerbanks
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/erreserbak" routerLinkActive="active">
                <i class="bi bi-calendar-check me-1"></i>Erreserbak
              </a>
            </li>
          </ul>

          <div class="app-user-area">
            <span class="app-user">
              <span class="app-avatar">
                <i class="bi bi-person-fill"></i>
              </span>
              <span class="app-user-name">{{ session()?.izena }}</span>
            </span>
            <button class="btn btn-sm app-logout" type="button" (click)="logout()">
              <i class="bi bi-box-arrow-right"></i>
              <span class="d-none d-sm-inline ms-1">Saioa itxi</span>
            </button>
          </div>
        </div>
      </div>
    </nav>
  </header>
}

<main class="app-main">
  <router-outlet />
</main>
